[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "urbansoc"
version = "0.2.0"
description = "Urban Safety AI-SOC: Human Detection, Pose Estimation and Dynamic Behavior Recognition"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Urban Safety AI-SOC Team"}
]
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "ultralytics>=8.3.0",
    "supervision>=0.22.0",
    "torch>=2.0.0",
    "mediapipe>=0.10.0",
    "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

[project.scripts]
urbansoc = "urbansoc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
